<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wily Foxy — Downloads</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111111;
            color: #eeeeee;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 28px 20px;
            border-bottom: 1px solid #292929;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        main {
            padding: 55px 20px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #999999;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .file-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px;
            margin-bottom: 14px;
            background: #1a1a1a;
            border: 1px solid #303030;
            border-radius: 10px;
        }

        .file-card h3 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .file-card p {
            margin: 0;
            color: #999999;
            font-size: 14px;
            line-height: 1.5;
        }

        .download-button {
            display: inline-block;
            padding: 11px 17px;
            background: #eeeeee;
            color: #111111;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            white-space: nowrap;
        }

        .download-button:hover {
            background: #cccccc;
        }

        footer {
            padding: 25px 20px;
            color: #666666;
            font-size: 13px;
            text-align: center;
            border-top: 1px solid #292929;
        }

        @media (max-width: 480px) {
            main {
                padding-top: 35px;
            }

            .file-card {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>WILY FOXY</h1>
        </div>
    </header>

    <main class="container">
        <h2>Downloads</h2>
        <p class="subtitle">
            Файлы и материалы проекта Wily Foxy.
        </p>

        <section class="file-card">
            <div>
                <h3>Скоро здесь появятся файлы</h3>
                <p>Описание и ссылки на скачивание добавим позже.</p>
            </div>
        </section>
    </main>

    <footer>
        Wily Foxy © 2026
    </footer>
</body>
</html>
