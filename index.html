<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <title>Wily Foxy — Downloads</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --background: #101010;
            --surface: #181818;
            --text: #f2f2f2;
            --muted: #929292;
            --border: #303030;
        }
        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 16, 16, 0.65);
            z-index: -1;
            pointer-events: none;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .container {
            width: min(100% - 40px, 900px);
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 3px;
            text-decoration: none;
        }

        .header-label {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            padding-top: 100px;
            padding-bottom: 100px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 24px;
            height: 1px;
            background: #eeeeee;
        }

        h1 {
            max-width: 750px;
            margin: 25px 0 20px;
            font-size: clamp(44px, 9vw, 82px);
            line-height: 0.98;
            letter-spacing: -4px;
        }

        h1 span {
            color: #777777;
        }

        .intro {
            max-width: 480px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 75px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .section-heading h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .section-number {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .empty-state {
            margin-top: 16px;
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .empty-state p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        footer {
            border-top: 1px solid var(--border);
        }

        .footer-inner {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            color: #777777;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 32px);
            }

            .header-inner {
                min-height: 68px;
            }

            .header-label {
                font-size: 9px;
                letter-spacing: 1px;
            }

            main {
                padding-top: 75px;
                padding-bottom: 70px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .section-heading {
                margin-top: 55px;
            }

            .empty-state {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="ПОБЕДА.mp4" type="video/mp4">
    </video>
    <div class="background-overlay"></div>
    <header>
        <div class="container header-inner">
            <a class="logo" href="./">WILY FOXY</a>
            <span class="header-label">Official downloads</span>
        </div>
    </header>

    <main class="container">
        <div class="eyebrow">Wily Foxy project</div>

        <h1>
            A place for<br>
            <span>your downloads.</span>
        </h1>

        <p class="intro">
            Файлы, материалы и другие ресурсы проекта Wily Foxy.
            Всё необходимое — в одном месте.
        </p>

        <section>
            <div class="section-heading">
                <h2>Доступные файлы</h2>
                <span class="section-number">01 / DOWNLOADS</span>
            </div>

            <div class="empty-state">
                <p>
                    Здесь скоро появятся файлы для скачивания.
                    Загляни сюда немного позже.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-inner">
            <span>WILY FOXY</span>
            <span>© 2026</span>
        </div>
    </footer>
</body>
</html>
